<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 600" width="100%" height="100%">
  <defs>
    <clipPath id="algeriaClip">
      <path d="svg1" transform="translate(45, 45) scale(0.95)"/>
    </clipPath>
    <filter id="mapShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background Frame & Mediterranean Sea -->
  <rect x="10" y="10" width="630" height="580" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="25" y="25" width="600" height="90" rx="16" fill="url(#seaGrad)" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#0369a1" letter-spacing="1">البحر الأبيض المتوسط (Mediterranean Sea)</text>
  <path d="M 120,78 Q 200,85 280,78 T 440,78" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Algeria Map Shadow Base -->
  <path d="svg1" transform="translate(48, 48) scale(0.95)" fill="#94a3b8" opacity="0.2" filter="url(#mapShadow)"/>

  <!-- Algeria Thematic Layers clipped inside authentic borders -->
  <g clip-path="url(#algeriaClip)">
    
  <!-- Sahara Arid Biome -->
  <rect x="0" y="0" width="650" height="600" fill="#fef3c7"/>

  <!-- Steppe Semi-Arid Biome (High Plateaus) -->
  <path d="M 130,135 C 220,130 330,140 435,130 L 420,210 C 310,215 200,205 110,215 Z" fill="#bef264" stroke="#65a30d" stroke-width="1.5"/>
  <text x="270" y="175" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#3f6212">إقليم السهوب الشبه جاف (الحلفاء والشيح)</text>

  <!-- Mediterranean Forest & Humid Coast -->
  <path d="M 160,85 C 240,75 350,85 450,70 L 440,135 C 335,145 230,135 145,135 Z" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="300" y="110" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#ffffff">الإقليم المتوسطي الرطب (غابات البلوط والصنوبر)</text>

  <!-- Sahara Oases Palm Groves -->
  
    <g transform="translate(380, 220)">
      <circle cx="0" cy="0" r="10" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3" text-anchor="middle" font-size="10">🌴</text>
      <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#1e293b">بسكرة</text>
    </g>
  
    <g transform="translate(300, 270)">
      <circle cx="0" cy="0" r="10" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3" text-anchor="middle" font-size="10">🌴</text>
      <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#1e293b">غرداية</text>
    </g>
  
    <g transform="translate(420, 280)">
      <circle cx="0" cy="0" r="10" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3" text-anchor="middle" font-size="10">🌴</text>
      <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#1e293b">تقرت وورقلة</text>
    </g>
  
    <g transform="translate(230, 350)">
      <circle cx="0" cy="0" r="10" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3" text-anchor="middle" font-size="10">🌴</text>
      <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#1e293b">تيميمون</text>
    </g>
  
    <g transform="translate(210, 400)">
      <circle cx="0" cy="0" r="10" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3" text-anchor="middle" font-size="10">🌴</text>
      <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#1e293b">أدرار</text>
    </g>
  
    <g transform="translate(470, 460)">
      <circle cx="0" cy="0" r="10" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3" text-anchor="middle" font-size="10">🌴</text>
      <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#1e293b">جانت</text>
    </g>
  
    <g transform="translate(420, 500)">
      <circle cx="0" cy="0" r="10" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3" text-anchor="middle" font-size="10">🌴</text>
      <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#1e293b">تمنراست</text>
    </g>
  
  <text x="320" y="360" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="900" fill="#d97706">الإقليم الصحراوي الجاف (نباتات شوكية وواحات)</text>

  </g>

  <!-- Official Border Outline -->
  <path d="svg1" transform="translate(45, 45) scale(0.95)" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Title Cartouche -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="280" height="50" rx="14" fill="#ffffff" fill-opacity="0.95" stroke="#0284c7" stroke-width="1.8" filter="url(#mapShadow)"/>
    <text x="140" y="22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="900" fill="#0f172a">خريطة الأقاليم المناخية والغطاء النباتي</text>
    <text x="140" y="40" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" fill="#64748b">المتوسطي • السهبي • الصحراوي • الواحات</text>
  </g>

  <!-- Legend Cartouche (مفتاح الخريطة) -->
  <g transform="translate(25, 380)">
    <rect x="0" y="0" width="210" height="128" rx="14" fill="#ffffff" fill-opacity="0.95" stroke="#94a3b8" stroke-width="1.5" filter="url(#mapShadow)"/>
    <text x="105" y="22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#0f172a">مفتاح الخريطة (Legend)</text>
    <line x1="20" y1="28" x2="190" y2="28" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(18, 42)">
      
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#16a34a" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">الإقليم المتوسطي (رطب / غابات كثيفة)</text>
    </g>
  
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#bef264" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">إقليم السهوب (شبه جاف / الحلفاء)</text>
    </g>
  
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#fef3c7" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">الإقليم الصحراوي (جاف / صحراوي)</text>
    </g>
  
    <g transform="translate(0, 66)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#15803d" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">الواحات الكبرى ومستثمرات النخيل</text>
    </g>
  
    </g>
  </g>

  <!-- Compass Rose (مؤشر الشمال الجغرافي) -->
  <g transform="translate(580, 70)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#mapShadow)"/>
    <polygon points="0,-18 5,-3 0,0" fill="#ef4444"/>
    <polygon points="0,-18 -5,-3 0,0" fill="#991b1b"/>
    <polygon points="0,18 5,3 0,0" fill="#64748b"/>
    <polygon points="0,18 -5,3 0,0" fill="#334155"/>
    <polygon points="-18,0 -3,-5 0,0" fill="#94a3b8"/>
    <polygon points="18,0 3,-5 0,0" fill="#94a3b8"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="0" y="-22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="900" fill="#ef4444">N</text>
  </g>

  <!-- Graphic Scale Bar (مقياس الرسم) -->
  <g transform="translate(420, 550)">
    <rect x="-10" y="-12" width="200" height="34" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="45" height="6" fill="#0f172a"/>
    <rect x="45" y="0" width="45" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="90" y="0" width="45" height="6" fill="#0f172a"/>
    <rect x="135" y="0" width="45" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="0" y="16" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">0</text>
    <text x="90" y="16" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">250 كم</text>
    <text x="180" y="16" text-anchor="end" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">500 كم</text>
  </g>
</svg>