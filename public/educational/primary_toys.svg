<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <filter id="toyShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="630" height="430" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="325" y="42" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="16" font-weight="900" fill="#0f172a">ألعاب وأدوات الحساب واللغة للطور الابتدائي (المعداد والمكعبات)</text>

  <!-- Left: Traditional Wooden Abacus (المعداد اليدوي) -->
  <g transform="translate(45, 75)" filter="url(#toyShadow)">
    <rect x="0" y="0" width="280" height="320" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <!-- Outer Wooden Frame -->
    <rect x="25" y="35" width="230" height="240" rx="10" fill="#fef3c7" stroke="#78350f" stroke-width="4"/>
    <!-- 5 Brass Wire Rods -->
    
      <line x1="30" y1="75" x2="250" y2="75" stroke="#ca8a04" stroke-width="3"/>
    
      <line x1="30" y1="115" x2="250" y2="115" stroke="#ca8a04" stroke-width="3"/>
    
      <line x1="30" y1="155" x2="250" y2="155" stroke="#ca8a04" stroke-width="3"/>
    
      <line x1="30" y1="195" x2="250" y2="195" stroke="#ca8a04" stroke-width="3"/>
    
      <line x1="30" y1="235" x2="250" y2="235" stroke="#ca8a04" stroke-width="3"/>
    
    <!-- Colorful Wooden Beads -->
    
      <circle cx="60" cy="75" r="12" fill="#ef4444" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="85" cy="75" r="12" fill="#ef4444" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="110" cy="75" r="12" fill="#ef4444" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="200" cy="75" r="12" fill="#ef4444" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="225" cy="75" r="12" fill="#ef4444" stroke="#0f172a" stroke-width="1.5"/>
    
      <circle cx="60" cy="115" r="12" fill="#3b82f6" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="85" cy="115" r="12" fill="#3b82f6" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="110" cy="115" r="12" fill="#3b82f6" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="200" cy="115" r="12" fill="#3b82f6" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="225" cy="115" r="12" fill="#3b82f6" stroke="#0f172a" stroke-width="1.5"/>
    
      <circle cx="60" cy="155" r="12" fill="#10b981" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="85" cy="155" r="12" fill="#10b981" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="110" cy="155" r="12" fill="#10b981" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="200" cy="155" r="12" fill="#10b981" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="225" cy="155" r="12" fill="#10b981" stroke="#0f172a" stroke-width="1.5"/>
    
      <circle cx="60" cy="195" r="12" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="85" cy="195" r="12" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="110" cy="195" r="12" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="200" cy="195" r="12" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="225" cy="195" r="12" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
    
      <circle cx="60" cy="235" r="12" fill="#8b5cf6" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="85" cy="235" r="12" fill="#8b5cf6" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="110" cy="235" r="12" fill="#8b5cf6" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="200" cy="235" r="12" fill="#8b5cf6" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="225" cy="235" r="12" fill="#8b5cf6" stroke="#0f172a" stroke-width="1.5"/>
    
    <text x="140" y="300" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="900" fill="#78350f">المعداد الحسابي (الأرقام والعد)</text>
  </g>

  <!-- Right: 3D Educational Wooden Blocks -->
  <g transform="translate(360, 75)" filter="url(#toyShadow)">
    <rect x="0" y="0" width="245" height="320" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Block 1: أ (Red) -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="75" height="75" rx="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2.5"/>
      <polygon points="0,0 20,-15 95,-15 75,0" fill="#f87171"/>
      <polygon points="75,0 95,-15 95,60 75,75" fill="#991b1b"/>
      <text x="37" y="52" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="36" font-weight="900" fill="#ffffff">أ</text>
    </g>

    <!-- Block 2: ب (Blue) -->
    <g transform="translate(130, 40)">
      <rect x="0" y="0" width="75" height="75" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
      <polygon points="0,0 20,-15 95,-15 75,0" fill="#60a5fa"/>
      <polygon points="75,0 95,-15 95,60 75,75" fill="#1e40af"/>
      <text x="37" y="52" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="36" font-weight="900" fill="#ffffff">ب</text>
    </g>

    <!-- Block 3: 1 (Green) -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="75" height="75" rx="8" fill="#10b981" stroke="#047857" stroke-width="2.5"/>
      <polygon points="0,0 20,-15 95,-15 75,0" fill="#34d399"/>
      <polygon points="75,0 95,-15 95,60 75,75" fill="#065f46"/>
      <text x="37" y="52" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="36" font-weight="900" fill="#ffffff">١</text>
    </g>

    <!-- Block 4: 2 (Yellow) -->
    <g transform="translate(130, 160)">
      <rect x="0" y="0" width="75" height="75" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
      <polygon points="0,0 20,-15 95,-15 75,0" fill="#fbbf24"/>
      <polygon points="75,0 95,-15 95,60 75,75" fill="#92400e"/>
      <text x="37" y="52" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="36" font-weight="900" fill="#ffffff">٢</text>
    </g>

    <text x="122" y="300" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="900" fill="#0369a1">مكعبات الحروف والأرقام ثلاثية الأبعاد</text>
  </g>
</svg>