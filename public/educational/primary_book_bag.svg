<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="bagShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="580" height="430" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="42" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="16" font-weight="900" fill="#0f172a">المحفظة المدرسية والكتاب والأدوات المدرسية — الطور الابتدائي</text>

  <!-- Left: Schoolbag (محفظة مدرسية) -->
  <g transform="translate(60, 75)" filter="url(#bagShadow)">
    <rect x="0" y="40" width="180" height="230" rx="30" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
    <!-- Top Handle & Straps -->
    <path d="M 60,40 Q 90,5 120,40" fill="none" stroke="#0369a1" stroke-width="8" stroke-linecap="round"/>
    <!-- Front Pocket -->
    <rect x="25" y="120" width="130" height="120" rx="16" fill="#f97316" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="40" y="135" width="100" height="12" rx="4" fill="#ffedd5"/>
    <!-- Side Water Bottle Pocket -->
    <rect x="-18" y="110" width="22" height="90" rx="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <rect x="-12" y="90" width="10" height="22" rx="3" fill="#ffffff"/>
    <text x="90" y="305" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="900" fill="#0369a1">المحفظة المدرسية</text>
  </g>

  <!-- Right: Open Textbook & Stationary -->
  <g transform="translate(290, 85)" filter="url(#bagShadow)">
    <!-- Open Book Pages -->
    <path d="M 20,60 Q 130,40 130,190 Q 20,210 20,60 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 240,60 Q 130,40 130,190 Q 240,210 240,60 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="130" y1="40" x2="130" y2="190" stroke="#0284c7" stroke-width="3"/>
    <!-- Text Lines -->
    <line x1="35" y1="80" x2="115" y2="75" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="100" x2="115" y2="95" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="120" x2="95" y2="115" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Book Illustration -->
    <rect x="145" y="70" width="80" height="55" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="185" cy="95" r="14" fill="#facc15"/>
    <text x="130" y="240" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="900" fill="#16a34a">كتاب القراءة المفتوح</text>

    <!-- Colored Pencils & Ruler -->
    <g transform="translate(10, 260)">
      <!-- 20cm Wooden Ruler -->
      <rect x="0" y="0" width="240" height="24" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
      <text x="120" y="16" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="900" fill="#b45309">مسطرة 20 سم</text>
      <!-- Pencils -->
      <polygon points="20,-15 28,-15 24,-30" fill="#fca5a5"/>
      <rect x="20" y="-15" width="8" height="35" fill="#ef4444"/>
      <polygon points="40,-15 48,-15 44,-30" fill="#93c5fd"/>
      <rect x="40" y="-15" width="8" height="35" fill="#3b82f6"/>
      <polygon points="60,-15 68,-15 64,-30" fill="#86efac"/>
      <rect x="60" y="-15" width="8" height="35" fill="#22c55e"/>
      <polygon points="80,-15 88,-15 84,-30" fill="#fde047"/>
      <rect x="80" y="-15" width="8" height="35" fill="#eab308"/>
    </g>
  </g>
</svg>