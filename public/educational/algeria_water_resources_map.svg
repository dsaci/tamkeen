<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 600" width="100%" height="100%">
  <defs>
    <clipPath id="algeriaClip">
      <path d="svg1" transform="translate(45, 45) scale(0.95)"/>
    </clipPath>
    <filter id="mapShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background Frame & Mediterranean Sea -->
  <rect x="10" y="10" width="630" height="580" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="25" y="25" width="600" height="90" rx="16" fill="url(#seaGrad)" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#0369a1" letter-spacing="1">البحر الأبيض المتوسط (Mediterranean Sea)</text>
  <path d="M 120,78 Q 200,85 280,78 T 440,78" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Algeria Map Shadow Base -->
  <path d="svg1" transform="translate(48, 48) scale(0.95)" fill="#94a3b8" opacity="0.2" filter="url(#mapShadow)"/>

  <!-- Algeria Thematic Layers clipped inside authentic borders -->
  <g clip-path="url(#algeriaClip)">
    
  <rect x="0" y="0" width="650" height="600" fill="#f0f9ff"/>

  <!-- Subterranean Aquifer (الحجر الرملي الألبي) -->
  <path d="M 220,260 C 320,240 450,250 490,380 C 440,440 280,450 200,380 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="340" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#0369a1">خزان المياه الجوفية الألبي العظيم</text>
  <text x="340" y="356" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#0284c7">(Continental Intercalaire)</text>

  <!-- Rivers (الأودية الدائمة) -->
  <!-- Chelif River -->
  <path d="M 230,160 Q 250,130 200,105" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>
  <text x="240" y="125" font-family="'Cairo', sans-serif" font-size="9" font-weight="900" fill="#0369a1">وادي الشلف (725 كم)</text>

  <!-- Soummam & Seybouse -->
  <path d="M 330,140 Q 325,115 315,90" fill="none" stroke="#0284c7" stroke-width="3"/>
  <text x="300" y="115" font-family="'Cairo', sans-serif" font-size="8" font-weight="800" fill="#0369a1">وادي الصومام</text>
  <path d="M 430,130 Q 420,110 415,85" fill="none" stroke="#0284c7" stroke-width="3"/>
  <text x="425" y="110" font-family="'Cairo', sans-serif" font-size="8" font-weight="800" fill="#0369a1">وادي سيبوس</text>

  <!-- Mega Dams (السدود الكبرى) -->
  
    <g transform="translate(390, 110)">
      <circle cx="0" cy="0" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="9">🌊</text>
      <text x="0" y="17" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#0f172a">سد بني هارون (ميلة - 1 مليار م³)</text>
    </g>
  
    <g transform="translate(310, 105)">
      <circle cx="0" cy="0" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="9">🌊</text>
      <text x="0" y="17" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#0f172a">سد تاقسبت (تيزي وزو)</text>
    </g>
  
    <g transform="translate(280, 115)">
      <circle cx="0" cy="0" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="9">🌊</text>
      <text x="0" y="17" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#0f172a">سد كدية أسردون (البويرة)</text>
    </g>
  
    <g transform="translate(190, 125)">
      <circle cx="0" cy="0" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="9">🌊</text>
      <text x="0" y="17" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#0f172a">سد بوحنيفية (معسكر)</text>
    </g>
  
    <g transform="translate(110, 260)">
      <circle cx="0" cy="0" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="9">🌊</text>
      <text x="0" y="17" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#0f172a">سد جرف التربة (بشار)</text>
    </g>
  

  </g>

  <!-- Official Border Outline -->
  <path d="svg1" transform="translate(45, 45) scale(0.95)" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Title Cartouche -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="280" height="50" rx="14" fill="#ffffff" fill-opacity="0.95" stroke="#0284c7" stroke-width="1.8" filter="url(#mapShadow)"/>
    <text x="140" y="22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="900" fill="#0f172a">خريطة الموارد المائية والسدود الكبرى</text>
    <text x="140" y="40" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" fill="#64748b">الأودية الدائمة • السدود الكبرى • المياه الجوفية بالصحراء</text>
  </g>

  <!-- Legend Cartouche (مفتاح الخريطة) -->
  <g transform="translate(25, 380)">
    <rect x="0" y="0" width="210" height="128" rx="14" fill="#ffffff" fill-opacity="0.95" stroke="#94a3b8" stroke-width="1.5" filter="url(#mapShadow)"/>
    <text x="105" y="22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#0f172a">مفتاح الخريطة (Legend)</text>
    <line x1="20" y1="28" x2="190" y2="28" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(18, 42)">
      
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#0284c7" stroke="#0284c7" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">الأودية والشبكة الهيدروغرافية الدائمة</text>
    </g>
  
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">السدود الكبرى ومحطات المعالجة</text>
    </g>
  
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">حوض المياه الجوفية الصحراوي العظيم</text>
    </g>
  
    <g transform="translate(0, 66)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">محطات تحلية مياه البحر على الساحل</text>
    </g>
  
    </g>
  </g>

  <!-- Compass Rose (مؤشر الشمال الجغرافي) -->
  <g transform="translate(580, 70)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#mapShadow)"/>
    <polygon points="0,-18 5,-3 0,0" fill="#ef4444"/>
    <polygon points="0,-18 -5,-3 0,0" fill="#991b1b"/>
    <polygon points="0,18 5,3 0,0" fill="#64748b"/>
    <polygon points="0,18 -5,3 0,0" fill="#334155"/>
    <polygon points="-18,0 -3,-5 0,0" fill="#94a3b8"/>
    <polygon points="18,0 3,-5 0,0" fill="#94a3b8"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="0" y="-22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="900" fill="#ef4444">N</text>
  </g>

  <!-- Graphic Scale Bar (مقياس الرسم) -->
  <g transform="translate(420, 550)">
    <rect x="-10" y="-12" width="200" height="34" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="45" height="6" fill="#0f172a"/>
    <rect x="45" y="0" width="45" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="90" y="0" width="45" height="6" fill="#0f172a"/>
    <rect x="135" y="0" width="45" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="0" y="16" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">0</text>
    <text x="90" y="16" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">250 كم</text>
    <text x="180" y="16" text-anchor="end" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">500 كم</text>
  </g>
</svg>