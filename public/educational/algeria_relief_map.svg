<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 600" width="100%" height="100%">
  <defs>
    <clipPath id="algeriaClip">
      <path d="svg1" transform="translate(45, 45) scale(0.95)"/>
    </clipPath>
    <filter id="mapShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background Frame & Mediterranean Sea -->
  <rect x="10" y="10" width="630" height="580" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="25" y="25" width="600" height="90" rx="16" fill="url(#seaGrad)" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#0369a1" letter-spacing="1">البحر الأبيض المتوسط (Mediterranean Sea)</text>
  <path d="M 120,78 Q 200,85 280,78 T 440,78" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Algeria Map Shadow Base -->
  <path d="svg1" transform="translate(48, 48) scale(0.95)" fill="#94a3b8" opacity="0.2" filter="url(#mapShadow)"/>

  <!-- Algeria Thematic Layers clipped inside authentic borders -->
  <g clip-path="url(#algeriaClip)">
    
  <!-- Land Base: Sand desert -->
  <rect x="0" y="0" width="650" height="600" fill="#fed7aa"/>
  
  <!-- Hoggar & Tassili Volcanic Massif (South) -->
  <path d="M 380,420 C 420,400 480,440 510,490 C 470,540 400,530 360,490 Z" fill="#9a3412" stroke="#7c2d12" stroke-width="2"/>
  <polygon points="440,450 448,430 456,450" fill="#7c2d12"/>
  <text x="448" y="468" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="900" fill="#ffffff">جبل تاهات (2918م)</text>
  <text x="448" y="480" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="700" fill="#ffedd5">الهڤار والتاصيلي</text>

  <!-- Great Erg Dunes -->
  <path d="M 180,240 Q 240,220 300,260 T 400,280 L 370,360 Q 270,360 210,330 Z" fill="#fde68a" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="290" y="295" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" fill="#b45309">العرق الغربي الكبير</text>
  <path d="M 380,220 Q 440,200 480,240 T 470,340 L 400,320 Z" fill="#fde68a" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="435" y="270" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" fill="#b45309">العرق الشرقي الكبير</text>

  <!-- Saharan Atlas Range -->
  <path d="M 120,180 C 180,170 280,185 380,175 L 430,200 C 320,215 200,205 110,210 Z" fill="#ca8a04" stroke="#a16207" stroke-width="2"/>
  <text x="260" y="196" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#ffffff">الأطلس الصحراوي (جبال القصور • العمور • الأوراس)</text>

  <!-- High Plateaus (الهضاب العليا) with Chotts -->
  <path d="M 140,135 C 220,130 320,140 430,135 L 420,175 C 310,180 210,170 130,180 Z" fill="#fef08a"/>
  <!-- Chott el Hodna & Melrhir -->
  <ellipse cx="320" cy="155" rx="24" ry="7" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="320" y="158" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="800" fill="#0369a1">شط الحضنة</text>
  <ellipse cx="390" cy="170" rx="30" ry="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="390" y="173" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="800" fill="#0369a1">شط ملغيغ (-35م)</text>
  <text x="210" y="158" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" fill="#854d0e">الهضاب العليا</text>

  <!-- Tell Atlas Coastal Mountains -->
  <path d="M 160,85 C 240,75 350,85 450,70 L 445,135 C 340,140 230,130 150,135 Z" fill="#15803d" stroke="#14532d" stroke-width="2"/>
  <text x="300" y="110" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#ffffff">الأطلس التلي (سلسلة جرجرة • الونشريس • البابور)</text>

  </g>

  <!-- Official Border Outline -->
  <path d="svg1" transform="translate(45, 45) scale(0.95)" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Title Cartouche -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="280" height="50" rx="14" fill="#ffffff" fill-opacity="0.95" stroke="#0284c7" stroke-width="1.8" filter="url(#mapShadow)"/>
    <text x="140" y="22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="900" fill="#0f172a">خريطة تضاريس الجزائر الكبرى</text>
    <text x="140" y="40" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" fill="#64748b">السلاسل الجبلية • الهضاب • الصحراء • القمم</text>
  </g>

  <!-- Legend Cartouche (مفتاح الخريطة) -->
  <g transform="translate(25, 380)">
    <rect x="0" y="0" width="210" height="150" rx="14" fill="#ffffff" fill-opacity="0.95" stroke="#94a3b8" stroke-width="1.5" filter="url(#mapShadow)"/>
    <text x="105" y="22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#0f172a">مفتاح الخريطة (Legend)</text>
    <line x1="20" y1="28" x2="190" y2="28" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(18, 42)">
      
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#15803d" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">الأطلس التلي والسهول الساحلية</text>
    </g>
  
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#fef08a" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">الهضاب العليا والشطوط الملحية</text>
    </g>
  
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#ca8a04" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">الأطلس الصحراوي (شلية 2328م)</text>
    </g>
  
    <g transform="translate(0, 66)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#fde68a" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">العرقان الكبيران (الكثبان الرملية)</text>
    </g>
  
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="16" height="12" rx="3" fill="#9a3412" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="10" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#1e293b">كتلة الهڤار والتاصيلي (تاهات 2918م)</text>
    </g>
  
    </g>
  </g>

  <!-- Compass Rose (مؤشر الشمال الجغرافي) -->
  <g transform="translate(580, 70)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#mapShadow)"/>
    <polygon points="0,-18 5,-3 0,0" fill="#ef4444"/>
    <polygon points="0,-18 -5,-3 0,0" fill="#991b1b"/>
    <polygon points="0,18 5,3 0,0" fill="#64748b"/>
    <polygon points="0,18 -5,3 0,0" fill="#334155"/>
    <polygon points="-18,0 -3,-5 0,0" fill="#94a3b8"/>
    <polygon points="18,0 3,-5 0,0" fill="#94a3b8"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="0" y="-22" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="900" fill="#ef4444">N</text>
  </g>

  <!-- Graphic Scale Bar (مقياس الرسم) -->
  <g transform="translate(420, 550)">
    <rect x="-10" y="-12" width="200" height="34" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="45" height="6" fill="#0f172a"/>
    <rect x="45" y="0" width="45" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="90" y="0" width="45" height="6" fill="#0f172a"/>
    <rect x="135" y="0" width="45" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="0" y="16" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">0</text>
    <text x="90" y="16" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">250 كم</text>
    <text x="180" y="16" text-anchor="end" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#334155">500 كم</text>
  </g>
</svg>