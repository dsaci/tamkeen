<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stoneGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="50%" stop-color="#d97706"/><stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="bronzeCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#b45309"/><stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="680" height="430" rx="20" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="16" font-weight="900" fill="#78350f">معالم ورموز الدولة النوميدية القديمة في الجزائر (القرن 3 ق.م)</text>

  <!-- 1. Medracen Royal Mausoleum (ضريح إيمدغاسن الملكي - باتنة) -->
  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="370" height="340" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="185" y="30" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="900" fill="#92400e">ضريح إيمدغاسن الملكي (المعذر - باتنة)</text>
    <text x="185" y="48" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" fill="#b45309">أقدم ضريح ملكي نوميدي أثري في شمال إفريقيا (القرن 3 ق.م)</text>
    
    <!-- Stepped Conical Pyramid Roof -->
    <g transform="translate(185, 70)">
      <rect x="-25" y="0" width="50" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-32" y="6" width="64" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-39" y="12" width="78" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-46" y="18" width="92" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-53" y="24" width="106" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-60" y="30" width="120" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-67" y="36" width="134" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-74" y="42" width="148" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-81" y="48" width="162" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-88" y="54" width="176" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-95" y="60" width="190" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-102" y="66" width="204" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-109" y="72" width="218" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-116" y="78" width="232" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-123" y="84" width="246" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-130" y="90" width="260" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-137" y="96" width="274" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/><rect x="-144" y="102" width="288" height="7" fill="#ca8a04" stroke="#78350f" stroke-width="1"/>
      <!-- Cylindrical Base with 60 Doric Columns -->
      <rect x="-155" y="112" width="310" height="90" fill="url(#stoneGold)" stroke="#78350f" stroke-width="2"/>
      <!-- Columns -->
      
        <rect x="-145" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="-125" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="-105" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="-85" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="-65" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="-45" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="-25" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="-5" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="15" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="35" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="55" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="75" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="95" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="115" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
        <rect x="135" y="112" width="10" height="90" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
      
      <!-- Ground stone base -->
      <rect x="-170" y="202" width="340" height="15" fill="#78350f"/>
    </g>
    <text x="185" y="315" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" fill="#451a03">بُني بحجارة ضخمة مصقولة وتزينه 60 سارية دورية كلاسيكية</text>
  </g>

  <!-- 2. King Masinissa Bronze Coin (قطعة نقدية مسكوكة للملك ماسينيسا) -->
  <g transform="translate(440, 75)">
    <rect x="0" y="0" width="220" height="340" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="110" y="30" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="900" fill="#92400e">عملة الملك ماسينيسا</text>
    <text x="110" y="48" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" fill="#b45309">برونزية مسكوكة (سيرتا - قسنطينة)</text>

    <!-- Coin Body -->
    <circle cx="110" cy="155" r="75" fill="url(#bronzeCoin)" stroke="#78350f" stroke-width="4"/>
    <circle cx="110" cy="155" r="68" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- King Masinissa Profile Silhouette -->
    <path d="M 95,115 Q 120,105 130,125 Q 135,140 120,150 Q 140,165 115,185 Q 90,195 85,175 Q 80,150 95,115 Z" fill="#fef08a" stroke="#78350f" stroke-width="2"/>
    <!-- Royal Diadem Crown -->
    <path d="M 95,115 L 125,120 L 105,125" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="110" y="260" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#92400e">MASINISSA REX</text>
    <text x="110" y="280" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="800" fill="#b45309">مؤسس الدولة النوميدية الموحدة</text>
    <text x="110" y="315" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="700" fill="#451a03">شعار: «إفريقيا للأفارقة»</text>
  </g>
</svg>