<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" height="100%">
  <defs>
    <linearGradient id="croBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="crtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="80%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011b15"/>
    </radialGradient>
    <filter id="sineGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4ade80" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Heavy Benchtop Chassis -->
  <rect x="20" y="20" width="560" height="400" rx="18" fill="url(#croBody)" stroke="#64748b" stroke-width="3"/>
  <rect x="35" y="35" width="530" height="370" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Left: CRT Screen (Green Phosphor Grid) -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="300" height="260" rx="16" fill="url(#crtGlow)" stroke="#15803d" stroke-width="4"/>
    <!-- 8x10 Divisions Grid -->
    <line x1="0" y1="0" x2="0" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="30" y1="0" x2="30" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="60" y1="0" x2="60" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="90" y1="0" x2="90" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="120" y1="0" x2="120" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="150" y1="0" x2="150" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="180" y1="0" x2="180" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="210" y1="0" x2="210" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="240" y1="0" x2="240" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="270" y1="0" x2="270" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="300" y1="0" x2="300" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
    <line x1="0" y1="0" x2="300" y2="0" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="0" y1="32.5" x2="300" y2="32.5" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="0" y1="65" x2="300" y2="65" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="0" y1="97.5" x2="300" y2="97.5" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="0" y1="130" x2="300" y2="130" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="0" y1="162.5" x2="300" y2="162.5" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="0" y1="195" x2="300" y2="195" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="0" y1="227.5" x2="300" y2="227.5" stroke="#059669" stroke-width="0.7" opacity="0.5"/><line x1="0" y1="260" x2="300" y2="260" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
    <!-- Center Axes -->
    <line x1="150" y1="0" x2="150" y2="260" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="130" x2="300" y2="130" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
    <!-- Glowing Green Sinusoidal Wave -->
    <path d="M 0,130 Q 37.5,30 75,130 T 150,130 T 225,130 T 300,130" fill="none" stroke="#4ade80" stroke-width="3.5" filter="url(#sineGlow)"/>
  </g>

  <!-- Screen Labels -->
  <text x="200" y="350" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="900" fill="#4ade80">شاشة راسم الاهتزازات المهبطي — إشارة توتر متناوب جيبي</text>
  <text x="200" y="370" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Umax = 3 Div × 2 V/Div = 6V | T = 4 Div × 5 ms/Div = 20ms</text>

  <!-- Right: Control Panel (Knobs, Dials, BNCs) -->
  <g transform="translate(380, 60)">
    <rect x="0" y="0" width="165" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="82" y="24" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="900" fill="#f59e0b">وحدة التحكم والضبط</text>

    <!-- Volts/Div Knob -->
    <circle cx="82" cy="65" r="24" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="82" cy="65" r="16" fill="#0f172a"/>
    <line x1="82" y1="65" x2="94" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="104" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="800" fill="#cbd5e1">الحساسية الشاقولية (V/Div)</text>

    <!-- Time/Div Knob -->
    <circle cx="82" cy="145" r="24" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="82" cy="145" r="16" fill="#0f172a"/>
    <line x1="82" y1="145" x2="68" y2="132" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="184" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="800" fill="#cbd5e1">المسح الزمني (Time/Div)</text>

    <!-- BNC Connectors -->
    <g transform="translate(45, 230)">
      <circle cx="0" cy="0" r="12" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#0f172a"/>
      <text x="0" y="20" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="800" fill="#94a3b8">CH 1</text>
    </g>
    <g transform="translate(120, 230)">
      <circle cx="0" cy="0" r="12" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#0f172a"/>
      <text x="0" y="20" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="8" font-weight="800" fill="#94a3b8">GND</text>
    </g>

    <!-- Power Switch -->
    <g transform="translate(82, 285)">
      <rect x="-25" y="-12" width="50" height="24" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
      <circle cx="-12" cy="0" r="4" fill="#22c55e"/>
      <text x="6" y="4" font-family="'Cairo', sans-serif" font-size="8" font-weight="900" fill="#ffffff">تشغيل</text>
    </g>
  </g>
</svg>