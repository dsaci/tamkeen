# ==============================================================================
# 🚀 Tamkeen Render Blueprint (مخطط النشر السحابي الموحد لمنظومة تمكين)
# ==============================================================================
# يتيح نشر منظومة تمكين بالكامل على Render بنقرة واحدة (1-Click Deploy)
# يتضمن:
# 1. tamkeen-web: استضافة الواجهة الثابتة مجاناً مع CDN عالمي فائق السرعة
# 2. tamkeen-ai: خادم بايثون الذكي المستقل (FastAPI) لمعالجة البلاغة والعروض والمذكرات
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. الواجهة الأمامية (Frontend Static Site) - 100% مجاني بدون سبات
  # ----------------------------------------------------------------------------
  - type: web
    name: tamkeen-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ----------------------------------------------------------------------------
  # 2. خادم الذكاء الاصطناعي ومعالجة اللغة العربية (Python FastAPI Microservice)
  # ----------------------------------------------------------------------------
  - type: web
    name: tamkeen-ai
    runtime: python
    rootDir: backend_ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      # اختياري: مفتاح نماذج مفتوحة المصدر مجاني (مثل Groq أو HuggingFace)
      # إذا لم يُحدد، يعمل محرك البلاغة والعروض الأصيل المدمج في الخادم تلقائياً
      - key: OPENSOURCE_AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENSOURCE_AI_MODEL
        value: llama-3.1-70b-versatile
      - key: OPENSOURCE_AI_API_KEY
        sync: false
